# Конфигурация Postgres для продакшна.
#
# Файл подставляется через `-c config_file=` (см. docker-compose.yml) и потому
# ЗАМЕНЯЕТ собой конфиг, который initdb сгенерировал внутри PGDATA, — всё, что
# здесь не указано, берёт встроенное умолчание, а оно не всегда совпадает
# с initdb-шным. Поэтому ниже продублирован блок локали: без него lc_numeric
# и lc_monetary стали бы 'C', а default_text_search_config — 'pg_catalog.simple'.
# Значения сверены с postgres:18.6-alpine.

#--- сеть -----------------------------------------------------------------
# Иначе база не примет соединения снаружи контейнера.
listen_addresses = '*'

#--- память ---------------------------------------------------------------
# Кэш страниц. Ориентир — четверть RAM хоста.
shared_buffers = 256MB

# Память на узел сортировки/хеша, а не на запрос: тяжёлый запрос с несколькими
# сортировками возьмёт кратно больше, и это ещё умножается на число соединений.
work_mem = 16MB

#--- планировщик ----------------------------------------------------------
# База на SSD, где случайное чтение почти не дороже последовательного.
# Дефолтные 4.0 рассчитаны на HDD и заставляют планировщик избегать индексов
# там, где они выгодны.
random_page_cost = 1.2

#--- локаль и время -------------------------------------------------------
# Значения, которые проставил бы initdb. Менять осознанно: lc_numeric влияет
# на форматирование чисел в to_char, timezone — на все операции с датами,
# включая правило удержания снепшотов (оно опирается на AT TIME ZONE 'UTC').
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
