# ОБРАЗЕЦ. Рабочий стенд — docker-compose.yml в корне репозитория, на него
# указывает COMPOSE в Makefile. Этот файл держится как справочный: пути в нём
# заданы относительно deploy/, поэтому запуск отсюда поднимет второй стек
# с другим каталогом данных — с этого и начался разъезд, описанный в CLAUDE.md.

name: investudy

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped

    # Единый .env в корне репозитория (см. CLAUDE.md). Образу нужны POSTGRES_DB,
    # POSTGRES_USER и POSTGRES_PASSWORD — они там уже есть.
    env_file:
      - ./.env

    environment:
      - TZ=Asia/Almaty
    ports:
      - "5432:5432"

    # conf нужно создать ДО запуска контейнера
    volumes:
      - ./_volume_db:/var/lib/postgresql
      - ./pg_conf/postgresql.conf:/etc/postgresql/postgresql.conf

    # Свой конфиг вместо сгенерированного initdb
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    stop_grace_period: 1m

    shm_size: 256mb


  bot:
    image: "almasnurbayev/investudy_bot:latest"
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TZ: Asia/Almaty
    command: ["sh", "-c", "/app/migrator -typeTask up && exec /app/bot"]
    
    # положить туда JSON
    volumes:
     - ./_volume_assets:/app/_volume_assets

    depends_on:
      postgres:
        condition: service_healthy    

# Отдельного сервиса-мигратора здесь нет: схему накатывает сам сервис при старте
# цепочкой в CMD образа (`/app/migrator -typeTask up && exec /app/parser`),
# поэтому мигратор гарантированно отрабатывает раньше и без depends_on.
#
# Когда сюда приедут бот или API, им понадобится перекрыть адрес БД — в .env
# POSTGRES_HOST=localhost верен для запуска на хосте, а изнутри сети compose
# база доступна по имени сервиса:
#     environment:
#       POSTGRES_HOST: postgres
#       POSTGRES_PORT: 5432
# environment имеет приоритет над env_file, так что правки .env не потребуются.
