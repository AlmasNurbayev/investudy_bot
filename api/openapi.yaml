openapi: 3.0.3
info:
  title: Investudy API
  version: 0.1.0
  description: |
    REST API веб-ОПиУ. Единственный источник правды для контракта: Go-сервер
    (oapi-codegen) и TS-типы фронта (openapi-typescript) генерируются отсюда.

    Суммы — десятичные строки ("-1234567.89"): NUMERIC(17,2) упирается в
    границу точности Number в JavaScript.

    Аутентификация — cookie `session` (HttpOnly, SameSite=Lax), same-origin
    через nginx. Решения — docs/plans/pnl-architecture.md.

security:
  - cookieAuth: []

paths:
  /api/auth/login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            Вход выполнен, cookie сессии установлена. Тело — то же, что отдаёт
            `GET /api/me`: после входа фронту не нужен второй запрос.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Слишком много неудачных попыток
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      operationId: logout
      summary: Выход — гасит текущую сессию
      responses:
        '204':
          description: Сессия погашена, cookie сброшена
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me:
    get:
      operationId: getMe
      summary: Текущий пользователь и его граница доступа
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/snapshots:
    get:
      operationId: listSnapshots
      summary: Версии среза для селектора
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/pnl:
    get:
      operationId: getPnl
      summary: ОПиУ по колонкам одной гранулярности
      description: |
        Строки обрезаны границей роли, руководителю отдела — только его
        подразделение. Неразмеченные статьи видит только администратор,
        остальным — флаг `incomplete`.
      parameters:
        - name: grain
          in: query
          schema:
            $ref: '#/components/schemas/Grain'
        - name: cols
          in: query
          description: |
            Колонки через запятую, не больше 12, все — выбранной гранулярности:
            `2026-03` (месяц), `2026-Q1` (квартал), `2026` (год).
            По умолчанию — последние 6 месяцев, включая текущий.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 12
            items:
              type: string
        - name: snapshot
          in: query
          description: Версия среза; по умолчанию — рабочая (новейшая непустая).
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users:
    get:
      operationId: listUsers
      summary: Пользователи (только администратор)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createUser
      summary: Завести пользователя (только администратор)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/users/{id}:
    put:
      operationId: updateUser
      summary: Изменить пользователя целиком (только администратор)
      description: |
        PUT, а не PATCH: форма всегда шлёт все поля, и «не прислали» не путается
        с «очистили» (division_id при смене роли). Смена роли, подразделения или
        блокировка гасит все сессии пользователя.
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/users/{id}/password:
    put:
      operationId: setUserPassword
      summary: Задать пароль пользователю (только администратор)
      description: |
        Старый пароль не спрашивается: менять пароли может только администратор.
        Все сессии пользователя гасятся.
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSet'
      responses:
        '204':
          description: Пароль задан
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/divisions:
    get:
      operationId: listDivisions
      summary: Подразделения — для выбора у руководителя отдела
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ref'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нет сессии или она погашена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Нужны права администратора
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Логин или Telegram-id уже заняты
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        problems:
          description: Нарушения проверки, по одному на пункт.
          type: array
          items:
            type: string

    Money:
      type: string
      description: Десятичная строка, точка, два знака.
      example: '-410997534.18'

    Role:
      type: string
      enum: [division_head, coo, cco, founder, cfo]

    Grain:
      type: string
      enum: [month, quarter, year]
      default: month

    Ref:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string

    Me:
      type: object
      required: [id, role, is_admin, has_report]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        division:
          allOf:
            - $ref: '#/components/schemas/Ref'
          nullable: true
        is_admin:
          type: boolean
        has_report:
          description: |
            Отчёт доступен. false — роль не назначена или неизвестна (например,
            viewer из старой таблицы бота): last_line тогда ничего не значит.
          type: boolean
        last_line:
          description: Код последней видимой строки ОПиУ, включительно; null — все.
          type: string
          nullable: true

    Snapshot:
      type: object
      required: [id, taken_at, row_count]
      properties:
        id:
          type: integer
          format: int64
        taken_at:
          type: string
          format: date-time
        row_count:
          type: integer
          format: int64

    SnapshotList:
      type: object
      required: [items]
      properties:
        current_id:
          description: Рабочая версия — новейшая непустая; null — данных нет.
          type: integer
          format: int64
          nullable: true
        items:
          description: Новейшие первыми.
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'

    SnapshotRef:
      type: object
      required: [id, taken_at, stale]
      properties:
        id:
          type: integer
          format: int64
        taken_at:
          type: string
          format: date-time
        stale:
          description: Показан не новейший срез — последняя загрузка пустая.
          type: boolean

    Column:
      type: object
      required: [key, title, from, to]
      properties:
        key:
          type: string
          example: '2026-03'
        title:
          type: string
          example: 'Мар 2026'
        from:
          type: string
          format: date
        to:
          description: Не включительно.
          type: string
          format: date

    PnlNode:
      type: object
      required: [dim, name, values]
      properties:
        dim:
          type: string
          enum: [division, sub_item]
        id:
          description: null — значение не заполнено в листе.
          type: integer
          format: int32
          nullable: true
        name:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        children:
          type: array
          items:
            $ref: '#/components/schemas/PnlNode'

    PnlLine:
      type: object
      required: [code, title, kind, values]
      properties:
        code:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [section, total]
        values:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        children:
          type: array
          items:
            $ref: '#/components/schemas/PnlNode'

    PnlUnmapped:
      type: object
      required: [item, values]
      properties:
        item:
          description: Пустая строка — проводки без статьи.
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/Money'

    PnlReport:
      type: object
      required: [snapshot, columns, lines, incomplete]
      properties:
        snapshot:
          $ref: '#/components/schemas/SnapshotRef'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/Column'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PnlLine'
        incomplete:
          description: Есть неразмеченные статьи — отчёт неполон.
          type: boolean
        unmapped:
          description: Только администратору.
          type: array
          items:
            $ref: '#/components/schemas/PnlUnmapped'

    User:
      type: object
      required: [id, role, is_admin, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
          nullable: true
        telegram_id:
          type: integer
          format: int64
          nullable: true
        username:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        division:
          allOf:
            - $ref: '#/components/schemas/Ref'
          nullable: true
        is_admin:
          type: boolean
        has_password:
          type: boolean
        blocked_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          description: Последний запрос на сайте; null — не входил.
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserUpdate:
      type: object
      required: [role, is_admin, blocked]
      properties:
        login:
          type: string
          nullable: true
        telegram_id:
          type: integer
          format: int64
          nullable: true
        username:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        division_id:
          type: integer
          format: int32
          nullable: true
        is_admin:
          type: boolean
        blocked:
          type: boolean

    UserCreate:
      allOf:
        - $ref: '#/components/schemas/UserUpdate'
        - type: object
          properties:
            password:
              description: Обязателен, если задан login.
              type: string
              nullable: true

    PasswordSet:
      type: object
      required: [password]
      properties:
        password:
          type: string
